help:
  title: "Roll Thingy Help"
  author: "RollThingy"
  icon-lore: "<gray>How to play, pay, and claim"
  page-how: |
    <gold><bold>Roll Thingy
    <white>Roll boxes and win prizes!
    <br><br><green>1)<white> Run <yellow>/roll<white>
    <green>2)<white> Click a box to see its prizes and payment
    <green>3)<white> Put the payment in the green row
    <green>4)<white> Click <green>Pay & Spin<white> and watch it roll!
  page-payment: |
    <gold><bold>Payment & Luck
    <white>Every box shows exactly what to pay on its detail screen.
    <br>Drop the items in the <green>green row<white>, then spin.
    <br><yellow>Exact<white> - must be that precise item.
    <yellow>Any type<white> - any item of that type counts.
    <br><aqua>Pay the full amount for the best luck!<white> Wrong or missing items make rare prizes rarer and the Zonk much more likely.
  page-claims: |
    <gold><bold>Prizes & Claims
    <white>Prize items go straight into your inventory.
    <br><red>Inventory full?<white> The prize is stored safely for you.
    <br>Get it with the <green>Your prizes<white> button or <yellow>/roll claim<white>.
  page-rarity: |
    <gold><bold>Rarity
    <white>Use <aqua>View prizes<white> to see every prize in a box.
    <br>Each shows its chance, like <yellow>1.5%<white> or <gold>1 in 1,000,000<white> for ultra-rare items.
  page-cooldown: |
    <gold><bold>Cooldowns
    <white>Each box has a cooldown after a spin.
    <br>The spin button shows how many seconds are left.
    <br>Wait it out or try another box!
