help:
  title: "Roll Thingy Help"
  author: "RollThingy"
  icon-lore: "<gray>How to play, pay, and claim"
  page-how: |
    <black><gold><bold>Roll Thingy
    <black>Roll boxes and win prizes!
    <br><br><green>1)<black> Run <yellow>/roll<black>
    <green>2)<black> Click a box to see its prizes and payment
    <green>3)<black> Put the payment in the green row
    <green>4)<black> Click <green>Pay & Spin<black> and watch it roll!
  page-payment: |
    <gold><bold>Payment & Luck
    <black>Every box shows exactly what to pay on its detail screen.
    <br>Drop the items in the <green>green row<black>, then spin.
    <br><yellow>Exact<black> - must be that precise item.
    <yellow>Any type<black> - any item of that type counts.
    <br><aqua>Pay the full amount for the best luck!<black> Wrong or missing items make rare prizes rarer and the Zonk much more likely.
  page-claims: |
    <gold><bold>Prizes & Claims
    <black>Prize items go straight into your inventory.
    <br><red>Inventory full?<black> The prize is stored safely for you.
    <br>Get it with the <green>Your prizes<black> button or <yellow>/roll claim<black>.
  page-rarity: |
    <gold><bold>Rarity
    <black>Use <aqua>View prizes<black> to see every prize in a box.
    <br>Each shows its chance, like <yellow>1.5%<black> or <gold>1 in 1,000,000<black> for ultra-rare items.
  page-cooldown: |
    <gold><bold>Cooldowns
    <black>Each box has a cooldown after a spin.
    <br>The spin button shows how many seconds are left.
    <br>Wait it out or try another box!
